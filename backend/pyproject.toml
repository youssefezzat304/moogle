[project]
name = "backend"
version = "0.1.0"
description = "HTTP API and orchestration layer for Moogle lunar retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.2",
    "moogle-inference",
    "pydantic>=2.12,<3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9",
    "pyyaml>=6",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
moogle-inference = { workspace = true }
