[project]
name = "backend"
version = "0.1.0"
description = "HTTP API and orchestration layer for Moogle lunar retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pyyaml>=6",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
