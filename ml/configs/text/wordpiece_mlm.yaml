model:
  architecture: bert

  vocab_size: 8000
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 512
  max_position_embeddings: 128

  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

  hidden_act: gelu
  layer_norm_eps: 1e-12
  initializer_range: 0.02

  pad_token_id: 0
  type_vocab_size: 2
  tie_word_embeddings: true

training:
  train_path: data/text/patches_description.parquet
  eval_path: null

  tokenizer_path: artifacts/tokenizers/wordpiece/v2.0/tokenizer.json

  output_root: results/mlm/runs
  run_name: wordpiece_mlm

  max_seq_len: 128

  batch_size: 32
  epochs: 30

  learning_rate: 1e-4
  weight_decay: 0.01

  device: auto
  seed: 42

mlm:
  mask_probability: 0.15
  mask_replace_probability: 0.8
  random_replace_probability: 0.1
  unchanged_probability: 0.1

tokenizer:
  type: wordpiece
  vocab_size: 8000