[project]
name = "clip"
version = "0.1.0"
description = "High-level LunarCLIP integration API for lunar multimodal retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightning>=2.6.5,<2.7",
    "pillow>=12.2.0",
    "polars>=1.39.3",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "streamlit>=1.58.0",
    "tensorboard>=2.20,<2.21",
    "tokenizers>=0.22.2",
    "torch==2.6.0+cu124",
    "transformers>=5.6.1",
]

[dependency-groups]
test = ["pytest>=9.0.1"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
