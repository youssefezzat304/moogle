[project]
name = "moogle-inference"
version = "0.1.0"
description = "Production semantic retrieval engine for Moogle"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clip",
    "torch==2.6.0+cu124",
]

[build-system]
requires = ["uv_build>=0.8.0,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.uv.sources]
clip = { path = "../ml", editable = true }
